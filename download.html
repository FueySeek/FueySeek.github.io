</head>
<body>

        <div class="nav-links">
            <a href="index.html" id="navHome" class="nav-item" data-lang-key="home">Home</a>
            <a href="download.html" class="nav-item active" data-lang-key="download">Download</a>

        </div>
    </header>

    <aside id="settingsPanel" class="settings-panel">
        <div class="settings-header">
            <h3 data-lang-key="settingsTitle">Settings</h3>
            <button id="closeSettings" class="close-btn" aria-label="Close">✕</button>
        </div>
        <div class="settings-body">
            <div class="setting-group">
                <label data-lang-key="theme">Theme</label>
                <div class="theme-options">
                    <button id="themeLight" class="theme-btn" data-theme="light" data-lang-key="themeLight">Light Theme</button>
                    <button id="themeDark" class="theme-btn" data-theme="dark" data-lang-key="themeDark">Dark Theme</button>
                </div>
            </div>
            <div class="setting-group">
                <label data-lang-key="language">Language</label>
                <div class="lang-options">
                    <button id="langEn" class="lang-btn" data-lang="en">English</button>
                    <button id="langZh" class="lang-btn" data-lang="zh">中文</button>
                </div>
            </div>
            <div class="setting-group">
                <label data-lang-key="handed">Left-handed Mode</label>
                <div class="handed-toggle-row">
                    <span class="handed-toggle-label" data-lang-key="handedToggle">Enable left-handed layout</span>
                    <button id="handedToggle" class="toggle-switch" role="switch" aria-checked="false" aria-label="Toggle left-handed mode">
                        <span class="toggle-knob"></span>
                    </button>
                </div>
                <p class="handed-desc" data-lang-key="handedDesc">Mirrors the settings panel, homepage hero and bottom controls to the left side, for left-handed use.</p>
            </div>
        </div>
        <div class="settings-footer">
            <button id="resetSettings" class="reset-btn" data-lang-key="resetSettings">Reset Settings</button>
        </div>
    </aside>

    <main class="page-container">
        <div class="page-card">
            <h1 data-lang-key="downloadTitle">Download</h1>
            <p data-lang-key="downloadDesc">Download Content Here</p>
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" data-lang-key="searchPlaceholder" placeholder="Search our projects">
                <button id="searchBtn" class="search-btn" data-lang-key="searchBtn">Search</button>
            </div>
            <div id="downloadList" class="download-list">
                <p class="loading-text" data-lang-key="loading">Loading...</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span class="footer-text">© 2020-<span id="footerYear">2026</span> Fuey All Rights Reserved</span>
    </footer>

    <script src="data/download-list.js"></script>
    <script src="js/lang.js"></script>
    <script src="js/rule.js"></script>
    <script src="js/common.js"></script>
    <script src="js/download.js"></script>
</body>
</html>
