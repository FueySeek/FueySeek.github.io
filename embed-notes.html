<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        html, body {
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
            height: auto;
            min-height: 0 !important;
            border-radius: var(--radius-sm);
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar { display: none; width: 0; height: 0; }
        body::before { display: none !important; }
        .embed-content { padding: 0; border-radius: var(--radius-sm); overflow: hidden; }
        .notes-card {
            position: relative;
            padding: 48px 24px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            transition: border-color 0.25s var(--smooth), box-shadow 0.3s var(--smooth);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            outline: none !important;
        }
        [data-theme="dark"] .notes-card { background: rgba(255, 255, 255, 0.06); }
        .notes-card:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.15);
        }
        .notes-card-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="embed-content">
        <div class="notes-card">
            <span class="notes-card-text" id="notesText">Something good is coming!</span>
        </div>
    </div>
    <script src="js/rule.js"></script>
    <script src="js/common.js"></script>
    <script>
        const TEXTS = {
            zh: "好东西要来了！",
            en: "Something good is coming!",
            ja: "良いものが来ます！",
            ko: "좋은 것이 오고 있어요!",
            fr: "De bonnes choses arrivent !",
            de: "Gute Dinge kommen!",
            es: "¡Buenas cosas están por venir!"
        };
        let currentLang = localStorage.getItem("fuey-lang") || "en";

        function apply() {
            const el = document.getElementById("notesText");
            if (el) el.textContent = TEXTS[currentLang] || TEXTS.en;
        }
        function reportHeight() {
            if (!window.parent || window.parent === window) return;
            const h = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            window.parent.postMessage({ type: "fuey-embed-resize", height: h }, "*");
        }

        window.addEventListener("message", (e) => {
            if (!e.data) return;
            if (e.data.type === "fuey-sync") {
                if (e.data.theme) {
                    document.documentElement.setAttribute("data-theme", e.data.theme);
                    document.documentElement.style.colorScheme = e.data.theme;
                }
                if (e.data.handed) document.documentElement.setAttribute("data-handed", e.data.handed);
                if (e.data.lang && e.data.lang !== currentLang) {
                    currentLang = e.data.lang;
                    localStorage.setItem("fuey-lang", currentLang);
                    apply();
                    reportHeight();
                }
            }
        });

        apply();
        document.documentElement.setAttribute("data-theme", localStorage.getItem("fuey-theme") || "light");

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "fuey-embed-ready" }, "*");
        }

        document.addEventListener("DOMContentLoaded", () => {
            apply();
            reportHeight();
        });

        if (window.ResizeObserver) {
            new ResizeObserver(reportHeight).observe(document.body);
        } else {
            setInterval(reportHeight, 500);
        }
    </script>
</body>
</html>
