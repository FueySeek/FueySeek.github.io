<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考试数据查看器</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000000'/%3E%3Cpath d='M10 6h9l5 5v14a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z' fill='none' stroke='%23ffffff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M19 6v5h5' fill='none' stroke='%23ffffff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M13 15h6M13 19h4' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
input,.sel{user-select:text;-webkit-user-select:text}
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --surface-3:#f5f5f5;
  --surface-inverse:#0a0a0a;
  --border:#e5e5e5;
  --border-2:#d4d4d4;
  --border-3:#a3a3a3;
  --fg:#0a0a0a;
  --fg-2:#262626;
  --fg-3:#404040;
  --muted:#525252;
  --subtle:#737373;
  --accent:#0a0a0a;
  --accent-fg:#ffffff;
  --accent-soft:#f5f5f5;
  --success:#16a34a;
  --success-bg:#f0fdf4;
  --success-fg:#15803d;
  --success-border:#86efac;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --danger-fg:#b91c1c;
  --danger-border:#fecaca;
  --warning:#d97706;
  --warning-bg:#fffbeb;
  --warning-fg:#b45309;
  --info:#2563eb;
  --info-bg:#eff6ff;
  --info-fg:#1d4ed8;
  --code-bg:#0a0a0a;
  --code-fg:#fafafa;
  --code-toolbar:#141414;
  --code-line:#525252;
  --code-line-hover:#a3a3a3;
  --r:8px;
  --r-lg:12px;
  --r-xl:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --shadow-lg:0 4px 8px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.12);
  --t:180ms cubic-bezier(.4,0,.2,1);
  --t-bounce:320ms cubic-bezier(.34,1.4,.64,1);
}
body.dark{
  --bg:#050505;
  --surface:#0f0f0f;
  --surface-2:#161616;
  --surface-3:#1f1f1f;
  --surface-inverse:#fafafa;
  --border:#262626;
  --border-2:#3f3f3f;
  --border-3:#525252;
  --fg:#fafafa;
  --fg-2:#e5e5e5;
  --fg-3:#d4d4d4;
  --muted:#a3a3a3;
  --subtle:#737373;
  --accent:#fafafa;
  --accent-fg:#0a0a0a;
  --accent-soft:#1f1f1f;
  --success:#22c55e;
  --success-bg:#052e16;
  --success-fg:#4ade80;
  --success-border:#166534;
  --danger:#ef4444;
  --danger-bg:#2a0a0a;
  --danger-fg:#f87171;
  --danger-border:#7f1d1d;
  --warning:#f59e0b;
  --warning-bg:#2a1a05;
  --warning-fg:#fbbf24;
  --info:#3b82f6;
  --info-bg:#0a1a33;
  --info-fg:#60a5fa;
  --code-bg:#000000;
  --code-fg:#e5e5e5;
  --code-toolbar:#141414;
  --code-line:#525252;
  --code-line-hover:#d4d4d4;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 3px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 4px 8px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.6);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background var(--t),color var(--t)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-3);background-clip:content-box;border:2px solid transparent}
*{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;transition:background var(--t),border-color var(--t)}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform var(--t-bounce)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.05)}
.logo-mark svg{width:17px;height:17px}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-.005em;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--fg);cursor:pointer;transition:background var(--t),border-color var(--t),color var(--t),transform var(--t),box-shadow var(--t);white-space:nowrap;line-height:1.4}
.btn:hover{background:var(--surface-3);border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.1);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-icon{padding:0;width:34px;height:34px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.import-view{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.import-card{width:100%;max-width:480px;padding:48px 36px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);text-align:center;cursor:pointer;transition:border-color var(--t),background var(--t),transform var(--t),box-shadow var(--t);box-shadow:var(--shadow)}
.import-card:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.import-card.drag{border-color:var(--fg);border-style:dashed;background:var(--surface-2);transform:scale(1.01)}
.import-icon{width:64px;height:64px;margin:0 auto 24px;border-radius:var(--r-lg);background:var(--surface-3);color:var(--fg);display:flex;align-items:center;justify-content:center;transition:transform var(--t-bounce)}
.import-card:hover .import-icon{transform:scale(1.05) rotate(-4deg)}
.import-icon svg{width:28px;height:28px}
.import-title{font-size:18px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.import-desc{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.import-hint{font-size:12px;color:var(--subtle);margin-top:18px}
.viewer-view{flex:1;display:flex;flex-direction:column;min-height:0}
.viewer-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;transition:background var(--t),border-color var(--t)}
.vt-left{display:flex;align-items:center;gap:10px;min-width:0;justify-self:start;overflow:hidden}
.file-badge{padding:3px 9px;font-size:10px;font-weight:800;border-radius:5px;background:var(--surface-3);color:var(--fg);letter-spacing:.08em;flex-shrink:0;text-transform:uppercase;border:1px solid var(--border-2)}
.file-badge.exam{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.file-badge.student{background:var(--success);color:#fff;border-color:var(--success)}
.file-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--fg-3);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.vt-center{justify-self:center;display:flex;justify-content:center;max-width:100%}
.vt-right{display:flex;gap:6px;justify-self:end;flex-shrink:0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-.005em;background:transparent;color:var(--muted);border:none;border-radius:7px;cursor:pointer;transition:color var(--t),background var(--t),box-shadow var(--t);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--accent-fg);background:var(--accent);box-shadow:var(--shadow-sm)}
.tab-count{font-size:10px;font-weight:800;padding:1px 6px;background:var(--surface-3);color:var(--muted);border-radius:10px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums;transition:background var(--t),color var(--t)}
.tab:hover .tab-count{background:var(--border);color:var(--fg-2)}
.tab.active .tab-count{background:rgba(255,255,255,.22);color:var(--accent-fg)}
body:not(.dark) .tab.active .tab-count{background:rgba(0,0,0,.15)}
.viewer-body{flex:1;overflow-y:auto;padding:28px 24px}
.viewer-content{max-width:820px;margin:0 auto;width:100%;animation:fadeIn 260ms cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.section{margin-bottom:26px}
.section-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;padding-left:4px;display:flex;align-items:center;justify-content:space-between}
.section-title-text{display:flex;align-items:center;gap:8px}
.section-title-text::before{content:"";width:3px;height:12px;background:var(--fg);border-radius:2px}
.kv-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:background var(--t),border-color var(--t)}
.kv-row{display:grid;grid-template-columns:180px 1fr auto;gap:16px;padding:13px 18px;align-items:center;border-top:1px solid var(--border);transition:background var(--t)}
.kv-row:first-child{border-top:none}
.kv-row:hover{background:var(--surface-2)}
.kv-k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:-.005em}
.kv-v{font-size:13px;word-break:break-word;min-width:0;padding:1px 0;color:var(--fg);font-weight:500}
.kv-v.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;font-weight:400}
.kv-v.empty{color:var(--subtle);font-style:italic;font-weight:400}
.kv-v-inner{display:flex;align-items:center;gap:6px}
.kv-v-inner span{flex:1;min-width:0;word-break:break-all}
.copy-btn{padding:0;width:28px;height:28px;background:transparent;border:1px solid transparent;color:var(--subtle);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all var(--t);flex-shrink:0}
.copy-btn:hover{background:var(--surface-3);color:var(--fg);border-color:var(--border)}
.copy-btn:active{transform:scale(.9)}
.copy-btn svg{width:13px;height:13px}
.eye-btn{padding:0;width:28px;height:28px;background:transparent;border:1px solid transparent;color:var(--subtle);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all var(--t);flex-shrink:0;touch-action:none}
.eye-btn:hover{background:var(--surface-3);color:var(--fg);border-color:var(--border)}
.eye-btn.pressing{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);transform:scale(.95)}
.eye-btn svg{width:15px;height:15px}
.audio-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;transition:background var(--t),border-color var(--t)}
.audio-card-head{display:flex;align-items:center;gap:14px}
.audio-card-icon{width:44px;height:44px;border-radius:50%;background:var(--surface-3);color:var(--fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--t);border:1px solid var(--border)}
.audio-card-icon svg{width:20px;height:20px}
.audio-card-icon.playing{animation:audioPulse 1.4s ease-in-out infinite;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@keyframes audioPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,0,0,.2)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(0,0,0,0)}}
body.dark .audio-card-icon.playing{animation:audioPulseDark 1.4s ease-in-out infinite}
@keyframes audioPulseDark{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.15)}50%{transform:scale(1.06);box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.audio-card-info{flex:1;min-width:0}
.audio-card-title{font-size:13px;font-weight:700;margin-bottom:2px;letter-spacing:-.005em}
.audio-card-desc{font-size:11px;color:var(--muted);line-height:1.5}
.audio-card-btn{padding:8px 18px;font-family:inherit;font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--r);cursor:pointer;transition:all var(--t);flex-shrink:0;letter-spacing:-.005em}
.audio-card-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.audio-card-btn:active{transform:translateY(0) scale(.97)}
.audio-card-btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--subtle);pointer-events:none;transition:color var(--t)}
.search:focus-within svg{color:var(--fg)}
.search input{width:100%;padding:9px 14px 9px 36px;font-family:inherit;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);outline:none;transition:all var(--t)}
.search input:hover{border-color:var(--border-2)}
.search input:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--surface-3)}
.search input::placeholder{color:var(--subtle);font-weight:400}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:6px 14px;font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;transition:all var(--t);white-space:nowrap;letter-spacing:-.005em}
.chip:hover{color:var(--fg);border-color:var(--border-2);transform:translateY(-1px)}
.chip:active{transform:translateY(0) scale(.97)}
.chip.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:var(--shadow-sm)}
.q-list{display:flex;flex-direction:column;gap:10px}
.q-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;transition:border-color var(--t),box-shadow var(--t),transform var(--t)}
.q-item:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.q-num{font-size:11px;font-weight:800;color:var(--fg);padding:3px 8px;background:var(--surface-3);border:1px solid var(--border);border-radius:5px;letter-spacing:.02em;font-family:ui-monospace,monospace}
.q-type{font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;letter-spacing:.06em}
.q-type.single{background:var(--info-bg);color:var(--info-fg)}
.q-type.multiple{background:var(--warning-bg);color:var(--warning-fg)}
.q-type.judge{background:var(--danger-bg);color:var(--danger-fg)}
.q-type.fill{background:var(--success-bg);color:var(--success-fg)}
body.dark .q-type.single{background:#0a1a33;color:#60a5fa}
body.dark .q-type.multiple{background:#2a1a05;color:#fbbf24}
body.dark .q-type.judge{background:#2a0a0a;color:#f87171}
body.dark .q-type.fill{background:#052e16;color:#4ade80}
.q-badge{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;letter-spacing:.02em}
.q-badge.ok{background:var(--success-bg);color:var(--success-fg);border:1px solid var(--success-border)}
.q-badge.no{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-border)}
.q-title{font-size:14px;margin-bottom:12px;line-height:1.6;word-break:break-word;color:var(--fg);font-weight:600;letter-spacing:-.005em}
.q-options{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;font-size:13px;border-radius:8px;background:var(--surface-2);border:1px solid transparent;transition:background var(--t),border-color var(--t)}
.q-opt.correct{background:var(--success-bg);border-color:var(--success-border)}
.q-opt-letter{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--fg-2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;transition:background var(--t),color var(--t)}
.q-opt.correct .q-opt-letter{background:var(--success);color:#fff}
.q-opt-text{flex:1;padding-top:1px;word-break:break-word;color:var(--fg);font-weight:500}
.q-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.q-meta b{color:var(--fg);font-weight:700;margin-left:2px}
.q-meta-item{display:inline-flex;align-items:center;gap:2px}
.q-meta-copy{padding:2px;width:22px;height:22px;background:transparent;border:none;color:var(--subtle);cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:all var(--t)}
.q-meta-copy:hover{color:var(--fg);background:var(--surface-3)}
.q-meta-copy svg{width:11px;height:11px}
.q-explanation{margin-top:12px;padding:10px 14px;background:var(--surface-2);border-left:3px solid var(--fg);border-radius:4px;font-size:12px;color:var(--fg-3);line-height:1.65;word-break:break-word;font-weight:500}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.user-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;transition:border-color var(--t),box-shadow var(--t)}
.user-card:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.user-name{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--fg);letter-spacing:-.005em}
.user-name-text{display:inline-flex;align-items:center;gap:4px}
.user-name .copy-btn{width:22px;height:22px;border-radius:5px}
.user-name .copy-btn svg{width:11px;height:11px}
.user-gender{font-size:10px;font-weight:800;padding:2px 7px;background:var(--surface-3);border:1px solid var(--border);border-radius:5px;color:var(--muted);letter-spacing:.04em}
.user-field{display:flex;gap:8px;font-size:11px;padding:4px 0;align-items:center}
.user-field-k{color:var(--muted);flex-shrink:0;min-width:70px;font-weight:600}
.user-field-v{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;flex:1;min-width:0;color:var(--fg-2);font-weight:500}
.user-field .copy-btn{padding:0;width:20px;height:20px}
.user-field .copy-btn svg{width:10px;height:10px}
.raw-container{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border)}
.raw-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--code-toolbar);border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--code-fg);gap:12px;flex-wrap:wrap}
.raw-info{opacity:.7;display:flex;gap:12px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-weight:500}
.raw-info span{display:inline-flex;align-items:center;gap:5px}
.raw-actions{display:flex;gap:8px}
.raw-actions .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--code-fg);font-size:12px;padding:6px 14px;font-weight:600}
.raw-actions .btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);transform:translateY(-1px)}
.raw-code{max-height:calc(100vh - 240px);overflow:auto;padding:12px 0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.75}
.code-line{display:flex;align-items:flex-start;transition:background var(--t)}
.code-line:hover{background:rgba(255,255,255,.04)}
.code-line-num{flex-shrink:0;min-width:56px;padding:0 16px 0 0;text-align:right;color:var(--code-line);user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums;border-right:1px solid rgba(255,255,255,.06);margin-right:16px;cursor:pointer;transition:color var(--t);font-weight:500}
.code-line-num:hover{color:var(--code-line-hover)}
.code-line-content{flex:1;white-space:pre-wrap;word-break:break-all;min-width:0;padding-right:16px;user-select:text;-webkit-user-select:text;color:var(--code-fg)}
.quiz-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:16px;flex-wrap:wrap;gap:12px;transition:background var(--t),border-color var(--t)}
.quiz-progress{font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;font-weight:500}
.quiz-progress b{color:var(--fg);font-weight:800;margin-left:5px;font-variant-numeric:tabular-nums}
.quiz-actions{display:flex;gap:6px;flex-wrap:wrap}
.quiz-actions .btn{padding:6px 13px;font-size:12px}
.quiz-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;transition:all var(--t)}
.quiz-item.revealed.correct{border-color:var(--success);box-shadow:0 0 0 3px var(--success-bg)}
.quiz-item.revealed.wrong{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.quiz-options{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;font-size:13px;border-radius:8px;background:var(--surface-2);cursor:pointer;transition:all var(--t);border:1px solid var(--border)}
.quiz-option:hover{background:var(--surface-3);border-color:var(--border-2);transform:translateX(2px)}
.quiz-option.selected{background:var(--accent-soft);border-color:var(--fg);box-shadow:0 0 0 2px var(--surface-3)}
.quiz-option.selected .q-opt-letter{background:var(--accent);color:var(--accent-fg)}
.quiz-option.correct{background:var(--success-bg);border-color:var(--success)}
.quiz-option.correct .q-opt-letter{background:var(--success);color:#fff}
.quiz-option.wrong{background:var(--danger-bg);border-color:var(--danger)}
.quiz-option.wrong .q-opt-letter{background:var(--danger);color:#fff}
.quiz-option.disabled{cursor:default;pointer-events:none;transform:none}
.quiz-input{width:100%;padding:10px 14px;margin:8px 0;font-family:inherit;font-size:13px;font-weight:500;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--fg);outline:none;transition:all var(--t)}
.quiz-input:hover{border-color:var(--border-2)}
.quiz-input:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--surface-3)}
.quiz-input:disabled{opacity:.7;cursor:default;background:var(--surface-3)}
.quiz-reveal{margin-top:10px;padding:6px 14px;font-size:12px;font-family:inherit;font-weight:600;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;transition:all var(--t);letter-spacing:-.005em}
.quiz-reveal:hover{background:var(--surface-3);color:var(--fg);border-color:var(--border-2);transform:translateY(-1px)}
.quiz-answer{margin-top:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:12px;line-height:1.65;color:var(--fg-2);font-weight:500}
.quiz-answer-line{margin-bottom:5px}
.quiz-answer-line:last-child{margin-bottom:0}
.quiz-answer-line b{color:var(--fg);font-weight:700}
.quiz-score{text-align:center;padding:36px 24px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-xl);margin-bottom:16px;box-shadow:0 0 0 4px var(--surface-3)}
.quiz-score-num{font-size:42px;font-weight:800;color:var(--fg);line-height:1;margin-bottom:8px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.quiz-score-desc{font-size:13px;color:var(--muted);font-weight:500}
.empty{text-align:center;padding:70px 20px;color:var(--subtle)}
.empty svg{width:40px;height:40px;opacity:.35;margin-bottom:12px}
.empty p{font-size:13px;font-weight:500}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);opacity:0;padding:11px 20px;background:var(--accent);color:var(--accent-fg);border-radius:10px;font-size:13px;font-weight:600;pointer-events:none;transition:all 280ms cubic-bezier(.34,1.4,.64,1);z-index:1000;max-width:90vw;box-shadow:var(--shadow-lg);letter-spacing:-.005em}
.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:768px){
  .header{padding:10px 16px}
  .viewer-top{grid-template-columns:1fr;gap:10px;padding:10px 16px}
  .vt-center{justify-self:stretch}
  .vt-right{justify-self:stretch;justify-content:flex-end}
  .vt-right .btn span{display:none}
  .vt-right .btn{padding:0;width:34px;height:34px}
  .viewer-body{padding:18px 14px}
  .kv-row{grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px}
  .kv-k{grid-column:1/-1;font-size:11px;padding-bottom:0}
  .kv-v{grid-column:1;font-size:12px}
  .code-line-num{min-width:38px;padding-right:11px;margin-right:11px;font-size:11px}
  .code-line-content{font-size:11.5px}
  .import-card{padding:36px 24px}
  .quiz-header{padding:14px}
  .toolbar{gap:8px}
  .search{min-width:150px}
  .user-grid{grid-template-columns:1fr}
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const TYPE_LIST = ['single', 'multiple', 'judge', 'fill'];
function typeLabel(type) {

}
function copyText(text) {

function fallbackCopy(text) {

function correctText(correct, type) {

  if (type === 'judge') return Number(correct) === 0 ? '✓' : '✗';
  if (Array.isArray(correct)) return correct.map(i => String.fromCharCode(65 + Number(i))).join(', ');
  return String.fromCharCode(65 + Number(correct));
}
function answerText(ans, type) {
  if (ans == null) return '';
  if (type === 'fill') {
    const arr = Array.isArray(ans) ? ans : [String(ans)];
    if (arr.every(a => String(a || '').trim() === '')) return '';

  if (type === 'judge') return Number(ans) === 0 ? '✓' : '✗';

  if (ans == null) return false;
  if (type === 'fill') { const arr = Array.isArray(ans) ? ans : [String(ans)]; return arr.some(a => String(a || '').trim() !== ''); }

function isCorrect(userAns, correct, type) {
  if (type === 'fill') {
    const ca = Array.isArray(correct) ? correct : [String(correct || '')];
    const ua = Array.isArray(userAns) ? userAns : [String(userAns || '')];
    if (ca.length !== ua.length) return false;
    for (let i = 0; i < ca.length; i++) { if (String(ca[i] || '').trim().toLowerCase() !== String(ua[i] || '').trim().toLowerCase()) return false; }
    return true;
  }
  if (type === 'multiple') {
    const ca = (Array.isArray(correct) ? correct : [correct]).map(Number).sort((a,b) => a-b);

      else if (window.STUDENT_RESULT && Array.isArray(window.STUDENT_RESULT.details)) { data = window.STUDENT_RESULT; type = 'student'; }
      if (!data) return showToast(T.invalidFile);

      state.dFilter = 'all'; state.dSearch = '';
      state.quizAnswers = {}; state.quizRevealed = {};
      state.audioPlaying = false;
      $('importView').style.display = 'none';
      $('viewerView').style.display = 'flex';
      $('fileBadge').textContent = type === 'exam' ? T.exam : T.student;
      $('fileBadge').className = 'file-badge ' + type;
      $('fileName').textContent = state.fileName;
      renderTabs();
      renderContent();
    } catch (err) { showToast(T.importFailed); }
  };
  reader.readAsText(file);
}
$('importCard').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
$('importCard').addEventListener('dragover', (e) => { e.preventDefault(); $('importCard').classList.add('drag'); });
$('importCard').addEventListener('dragleave', () => $('importCard').classList.remove('drag'));
$('importCard').addEventListener('drop', (e) => { e.preventDefault(); $('importCard').classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
$('reimportBtn').addEventListener('click', () => {
  state.data = null; state.dataType = null; state.rawText = ''; state.fileName = ''; state.tab = 'overview';
  state.quizAnswers = {}; state.quizRevealed = {};
  if (state.audioPlaying && window.speechSynthesis) speechSynthesis.cancel();
  state.audioPlaying = false;
  $('viewerView').style.display = 'none';
  $('importView').style.display = 'flex';
});
$('themeBtn').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); });
document.addEventListener('contextmenu', (e) => { e.preventDefault(); warnThrottled(T.rightDisabled); });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = (e.key || '').toUpperCase();
  if (e.key === 'F12') { e.preventDefault(); warnThrottled(T.devDisabled); return; }
  if (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) { e.preventDefault(); warnThrottled(T.devDisabled); return; }
  if (e.ctrlKey && k === 'U') { e.preventDefault(); warnThrottled(T.srcDisabled); return; }
  if (!e.ctrlKey && !e.altKey && !e.metaKey && e.key >= '1' && e.key <= '6' && state.dataType) {
    const tabs = getTabs();
    const idx = parseInt(e.key) - 1;
    if (tabs[idx]) { state.tab = tabs[idx].id; renderTabs(); renderContent(); }
  }
});
applyTheme();
</script>
</body>
</html>
