<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机点名器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0d0d0f;
color:#e6e6e6;
padding:24px 16px;
min-height:100vh;
font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Oxygen,
Ubuntu,
Cantarell,
"Fira Sans",
"Droid Sans",
"Helvetica Neue",
sans-serif;
display:flex;
flex-direction:column;
align-items:center;
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}
@media(min-width:768px){
body{padding:48px max(20px,calc(50vw - 320px))}
}
.header-wrap{
display:flex;
align-items:center;
justify-content:center;
width:100%;
max-width:640px;
margin-bottom:28px;
gap:16px;
}
.main-title{
font-size:22px;
color:#f0f0f0;
font-weight:600;
letter-spacing:0.01em;
}
.panel{
width:100%;
max-width:640px;
background:#141416;
border:1px solid #262629;
border-radius:18px;
padding:28px;
display:flex;
flex-direction:column;
gap:20px;
box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
.display{
position:relative;
background:#1a1a1d;
border:1px solid #2a2a2e;
border-radius:14px;
padding:44px 24px;
min-height:170px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}
.display::before{
content:"";
position:absolute;
top:0;left:16px;right:16px;
height:1px;
background:linear-gradient(90deg,transparent,#3a3a40,transparent);
}
#show{
font-size:clamp(2.2rem,9vw,3.2rem);
font-weight:600;
color:#f0f0f0;
line-height:1.15;
text-align:center;
word-break:break-all;
transition:color 0.25s ease,letter-spacing 0.25s ease,transform 0.25s ease;
}
#show.picked{
color:#fff;
letter-spacing:0.02em;
transform:scale(1.02);
}
.status{
text-align:center;
font-size:14px;
color:#8a8a90;
min-height:20px;
line-height:20px;
letter-spacing:0.01em;
}
.btn-group{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
@media(min-width:560px){
.btn-group.cols-3{grid-template-columns:repeat(3,1fr)}
}
button{
font-family:inherit;
font-size:15px;
font-weight:500;
padding:12px 18px;
border-radius:10px;
border:1px solid transparent;
cursor:pointer;
transition:background 0.2s ease,border-color 0.2s ease,color 0.2s ease,transform 0.1s ease;
white-space:nowrap;
letter-spacing:0.01em;
}
button:active{transform:translateY(1px)}
.btn-primary{
background:#f0f0f0;
border-color:#f0f0f0;
color:#0d0d0f;
}
.btn-primary:hover{background:#fff;border-color:#fff}
.btn-secondary{
background:transparent;
border-color:#2e2e32;
color:#c8c8cc;
}
.btn-secondary:hover{
border-color:#55555c;
color:#fff;
background:#1a1a1d;
}
.edit-wrap{
display:none;
flex-direction:column;
gap:12px;
padding-top:20px;
border-top:1px solid #262629;
}
.edit-wrap.active{display:flex}
#editArea{
width:100%;
height:180px;
background:#1a1a1d;
border:1px solid #2a2a2e;
color:#e6e6e6;
padding:16px;
border-radius:12px;
font-family:inherit;
font-size:15px;
line-height:1.6;
resize:vertical;
outline:none;
transition:border-color 0.2s ease,background 0.2s ease;
}
#editArea:hover{border-color:#3a3a40}
#editArea:focus{border-color:#55555c;background:#1c1c1f}
.footer{
margin-top:36px;
font-size:13px;
color:#5a5a60;
text-align:center;
letter-spacing:0.02em;
}
#toast{
position:fixed;
left:50%;
bottom:32px;
transform:translate(-50%,20px);
background:#1a1a1d;
border:1px solid #2e2e32;
color:#f0f0f0;
padding:12px 20px;
border-radius:12px;
font-size:14px;
letter-spacing:0.01em;
opacity:0;
pointer-events:none;
transition:opacity 0.25s ease,transform 0.25s ease;
z-index:9999;
box-shadow:0 8px 24px rgba(0,0,0,0.5);
max-width:calc(100vw - 40px);
text-align:center;
}
#toast.show{
opacity:1;
transform:translate(-50%,0);
}
</style>
</head>
<body>
<div class="header-wrap">
<h1 class="main-title" id="titleText">随机点名器</h1>
</div>
<div class="panel">
<div class="display">
<div id="show">—</div>
</div>
<div class="status" id="status"></div>
<div class="btn-group cols-3">
<button id="start" class="btn-primary">开始</button>
<button id="reset" class="btn-secondary">重置</button>
<button id="edit" class="btn-secondary">编辑名单</button>
<button id="setPwd" class="btn-secondary">修改密码</button>
<button id="importBtn" class="btn-secondary">导入配置</button>
<button id="exportBtn" class="btn-secondary">导出配置</button>
</div>
<div class="edit-wrap" id="editWrap">
<textarea id="editArea" placeholder="每行一个名字"></textarea>
<div class="btn-group">
<button id="save" class="btn-primary">保存名单</button>
<button id="cancel" class="btn-secondary">取消编辑</button>
</div>
</div>
</div>
<div class="footer">© 2020-2026 fuey 保留所有权利</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".js" hidden>
<script src="config.js"></script>
<script>
const faviconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#161618" stroke="#3a3a40" stroke-width="1.4"/><circle cx="15" cy="12.5" r="3.6" fill="none" stroke="#e8e8ec" stroke-width="1.8"/><path d="M8 24.5c0-3.9 3.2-7 7-7s7 3.1 7 7" fill="none" stroke="#e8e8ec" stroke-width="1.8" stroke-linecap="round"/><circle cx="23.5" cy="8.5" r="2" fill="#e8e8ec"/></svg>';
const faviconBlob = new Blob([faviconSvg], {type: "image/svg+xml"});
const faviconUrl = URL.createObjectURL(faviconBlob);
const faviconLink = document.createElement("link");
faviconLink.rel = "icon";
faviconLink.type = "image/svg+xml";
faviconLink.href = faviconUrl;
document.head.appendChild(faviconLink);

const txt = {
  title: "随机点名器",
  start: "开始",
  stop: "停止",
  reset: "重置",
  edit: "编辑名单",
  setPwd: "修改密码",
  importBtn: "导入配置",
  exportBtn: "导出配置",
  save: "保存名单",
  cancel: "取消编辑",
  statusLoaded: n => `已加载 ${n} 人`,
  statusRemaining: (total, picked) => `已点 ${picked} / 共 ${total} 人`,
  statusEmpty: "请先编辑名单",
  statusAllDone: "已全部点完",
  statusReset: "已重置",
  statusPwdChanged: "密码已修改，请导出配置保存",
  statusSaved: "配置已导出",
  statusCanceled: "已取消编辑",
  statusImported: "配置导入成功",
  statusImportFail: "配置文件解析失败",
  statusPwdWrong: "密码错误",
  promptEdit: "请输入管理员密码：",
  promptOldPwd: "请输入当前密码：",
  promptNewPwd: "请输入新密码：",
  promptSave: "请输入管理员密码以保存：",
  placeholder: "每行一个名字",
  blockRightClick: "此操作已被禁用",
  blockDevTools: "开发者工具已被禁用",
  blockViewSource: "查看源代码已被禁用"
};

let pwd = (typeof adminPwd !== "undefined" && typeof adminPwd === "string") ? adminPwd : "";
let list = (typeof nameList !== "undefined" && Array.isArray(nameList)) ? nameList.slice() : [];
let used = new Set();
let currentIdx = -1;
let rolling = false;
let timer = null;
let isEditVerified = false;
let statusKey = "statusLoaded";
let statusArgs = [list.length];
let toastTimer = null;

const show = document.getElementById("show");
const statusEl = document.getElementById("status");
const titleText = document.getElementById("titleText");
const startBtn = document.getElementById("start");
const resetBtn = document.getElementById("reset");
const editBtn = document.getElementById("edit");
const setPwdBtn = document.getElementById("setPwd");
const importBtn = document.getElementById("importBtn");
const exportBtn = document.getElementById("exportBtn");
const saveBtn = document.getElementById("save");
const cancelBtn = document.getElementById("cancel");
const editArea = document.getElementById("editArea");
const editWrap = document.getElementById("editWrap");
const fileInput = document.getElementById("fileInput");
const toastEl = document.getElementById("toast");

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 1800);
}

function setStatus(key, ...args){
  statusKey = key;
  statusArgs = args;
  const fn = txt[key];
  statusEl.textContent = typeof fn === "function" ? fn(...args) : fn;
}

function refreshText(){
  titleText.textContent = txt.title;
  startBtn.textContent = rolling ? txt.stop : txt.start;
  resetBtn.textContent = txt.reset;
  editBtn.textContent = txt.edit;
  setPwdBtn.textContent = txt.setPwd;
  importBtn.textContent = txt.importBtn;
  exportBtn.textContent = txt.exportBtn;
  saveBtn.textContent = txt.save;
  cancelBtn.textContent = txt.cancel;
  editArea.placeholder = txt.placeholder;
  setStatus(statusKey, ...statusArgs);
}

function stopRolling(){
  rolling = false;
  clearInterval(timer);
  startBtn.textContent = txt.start;
}

function clearDisplay(){
  show.textContent = "—";
  show.classList.remove("picked");
  currentIdx = -1;
}

function exportConfigFile(){
  const content = `const adminPwd = ${JSON.stringify(pwd)};

const nameList = ${JSON.stringify(list, null, 2)};`;
  const blob = new Blob([content], {type: "text/javascript;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "config.js";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus("statusSaved");
  setTimeout(() => {
    if(statusKey === "statusSaved") setStatus("statusLoaded", list.length);
  }, 1400);
}

function importConfigFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const code = e.target.result;
      const fn = new Function(code + "\nreturn { adminPwd, nameList };");
      const res = fn();
      if(typeof res.adminPwd !== "string" || !Array.isArray(res.nameList)) throw new Error("invalid");
      pwd = res.adminPwd;
      list = res.nameList.map(s => String(s)).filter(s => s.trim() !== "");
      used.clear();
      stopRolling();
      clearDisplay();
      editWrap.classList.remove("active");
      editArea.value = "";
      isEditVerified = false;
      refreshText();
      setStatus("statusImported");
      setTimeout(() => {
        if(statusKey === "statusImported") setStatus("statusLoaded", list.length);
      }, 1400);
    } catch(err) {
      alert(txt.statusImportFail);
    }
  };
  reader.onerror = () => alert(txt.statusImportFail);
  reader.readAsText(file);
}

startBtn.onclick = () => {
  if(list.length === 0){
    setStatus("statusEmpty");
    return;
  }
  if(!rolling){
    rolling = true;
    startBtn.textContent = txt.stop;
    show.classList.remove("picked");
    timer = setInterval(() => {
      const remaining = [];
      for(let i = 0; i < list.length; i++){
        if(!used.has(i)) remaining.push(i);
      }
      if(remaining.length === 0){
        stopRolling();
        clearDisplay();
        setStatus("statusAllDone");
        return;
      }
      currentIdx = remaining[Math.floor(Math.random() * remaining.length)];
      show.textContent = list[currentIdx];
    }, 80);
  } else {
    stopRolling();
    if(currentIdx >= 0 && !used.has(currentIdx)){
      used.add(currentIdx);
      show.classList.add("picked");
    }
    if(used.size >= list.length){
      setStatus("statusAllDone");
    } else {
      setStatus("statusRemaining", list.length, used.size);
    }
    currentIdx = -1;
  }
};

resetBtn.onclick = () => {
  used.clear();
  stopRolling();
  clearDisplay();
  setStatus("statusReset");
  setTimeout(() => {
    if(statusKey === "statusReset") setStatus("statusLoaded", list.length);
  }, 1200);
};

editBtn.onclick = () => {
  if(editWrap.classList.contains("active")) return;
  const input = prompt(txt.promptEdit);
  if(input === null) return;
  if(input !== pwd){
    alert(txt.statusPwdWrong);
    return;
  }
  isEditVerified = true;
  editArea.value = list.join("\n");
  editWrap.classList.add("active");
};

setPwdBtn.onclick = () => {
  const old = prompt(txt.promptOldPwd);
  if(old === null) return;
  if(old !== pwd){
    alert(txt.statusPwdWrong);
    return;
  }
  const np = prompt(txt.promptNewPwd);
  if(np === null || np.trim() === "") return;
  pwd = np;
  isEditVerified = true;
  setStatus("statusPwdChanged");
};

importBtn.onclick = () => {
  fileInput.click();
};

fileInput.onchange = e => {
  const f = e.target.files[0];
  if(f) importConfigFile(f);
  fileInput.value = "";
};

exportBtn.onclick = () => {
  exportConfigFile();
};

saveBtn.onclick = () => {
  if(!isEditVerified){
    const input = prompt(txt.promptSave);
    if(input === null) return;
    if(input !== pwd){
      alert(txt.statusPwdWrong);
      return;
    }
    isEditVerified = true;
  }
  list = editArea.value.split("\n").map(s => s.trim()).filter(Boolean);
  used.clear();
  stopRolling();
  clearDisplay();
  editWrap.classList.remove("active");
  editArea.value = "";
  isEditVerified = false;
  exportConfigFile();
};

cancelBtn.onclick = () => {
  editWrap.classList.remove("active");
  editArea.value = "";
  isEditVerified = false;
  setStatus("statusCanceled");
  setTimeout(() => {
    if(statusKey === "statusCanceled") setStatus("statusLoaded", list.length);
  }, 1200);
};

document.addEventListener("contextmenu", e => {
  e.preventDefault();
  showToast(txt.blockRightClick);
});
document.addEventListener("keydown", e => {
  const k = e.key.toUpperCase();
  if(e.key === "F12"){
    e.preventDefault();
    showToast(txt.blockDevTools);
    return false;
  }
  if(e.ctrlKey && e.shiftKey && (k === "I" || k === "J" || k === "C")){
    e.preventDefault();
    showToast(txt.blockDevTools);
    return false;
  }
  if(e.ctrlKey && k === "U"){
    e.preventDefault();
    showToast(txt.blockViewSource);
    return false;
  }
});

refreshText();
</script>
</body>
</html>
