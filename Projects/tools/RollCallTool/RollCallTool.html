<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Name Picker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0d0d0f;
color:#e6e6e6;
padding:24px 16px;
min-height:100vh;
font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Oxygen,
Ubuntu,
Cantarell,
"Fira Sans",
"Droid Sans",
"Helvetica Neue",
sans-serif;
display:flex;
flex-direction:column;
align-items:center;
-webkit-font-smoothing:antialiased;
-moz-osx-font-smoothing:grayscale;
}
@media(min-width:768px){
body{padding:48px max(20px,calc(50vw - 320px))}
}
.header-wrap{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
max-width:640px;
margin-bottom:28px;
gap:16px;
}
.main-title{
font-size:22px;
color:#f0f0f0;
font-weight:600;
letter-spacing:0.01em;
}
#langSelect{
font-family:inherit;
font-size:14px;
background:#161618;
border:1px solid #2e2e32;
color:#e6e6e6;
padding:9px 14px;
border-radius:10px;
outline:none;
cursor:pointer;
transition:border-color 0.2s ease,background 0.2s ease;
}
#langSelect:hover{border-color:#4a4a50;background:#1a1a1d}
#langSelect:focus{border-color:#8a8a90}
.panel{
width:100%;
max-width:640px;
background:#141416;
border:1px solid #262629;
border-radius:18px;
padding:28px;
display:flex;
flex-direction:column;
gap:20px;
box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
.display{
position:relative;
background:#1a1a1d;
border:1px solid #2a2a2e;
border-radius:14px;
padding:44px 24px;
min-height:170px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}
.display::before{
content:"";
position:absolute;
top:0;left:16px;right:16px;
height:1px;
background:linear-gradient(90deg,transparent,#3a3a40,transparent);
}
#show{
font-size:clamp(2.2rem,9vw,3.2rem);
font-weight:600;
color:#f0f0f0;
line-height:1.15;
text-align:center;
word-break:break-all;
transition:color 0.25s ease,letter-spacing 0.25s ease,transform 0.25s ease;
}
#show.picked{
color:#fff;
letter-spacing:0.02em;
transform:scale(1.02);
}
.status{
text-align:center;
font-size:14px;
color:#8a8a90;
min-height:20px;
line-height:20px;
letter-spacing:0.01em;
}
.btn-group{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
@media(min-width:560px){
.btn-group.cols-3{grid-template-columns:repeat(3,1fr)}
}
button{
font-family:inherit;
font-size:15px;
font-weight:500;
padding:12px 18px;
border-radius:10px;
border:1px solid transparent;
cursor:pointer;
transition:background 0.2s ease,border-color 0.2s ease,color 0.2s ease,transform 0.1s ease;
white-space:nowrap;
letter-spacing:0.01em;
}
button:active{transform:translateY(1px)}
.btn-primary{
background:#f0f0f0;
border-color:#f0f0f0;
color:#0d0d0f;
}
.btn-primary:hover{background:#fff;border-color:#fff}
.btn-secondary{
background:transparent;
border-color:#2e2e32;
color:#c8c8cc;
}
.btn-secondary:hover{
border-color:#55555c;
color:#fff;
background:#1a1a1d;
}
.edit-wrap{
display:none;
flex-direction:column;
gap:12px;
padding-top:20px;
border-top:1px solid #262629;
}
.edit-wrap.active{display:flex}
#editArea{
width:100%;
height:180px;
background:#1a1a1d;
border:1px solid #2a2a2e;
color:#e6e6e6;
padding:16px;
border-radius:12px;
font-family:inherit;
font-size:15px;
line-height:1.6;
resize:vertical;
outline:none;
transition:border-color 0.2s ease,background 0.2s ease;
}
#editArea:hover{border-color:#3a3a40}
#editArea:focus{border-color:#55555c;background:#1c1c1f}
.footer{
margin-top:36px;
font-size:13px;
color:#5a5a60;
text-align:center;
letter-spacing:0.02em;
}
#toast{
position:fixed;
left:50%;
bottom:32px;
transform:translate(-50%,20px);
background:#1a1a1d;
border:1px solid #2e2e32;
color:#f0f0f0;
padding:12px 20px;
border-radius:12px;
font-size:14px;
letter-spacing:0.01em;
opacity:0;
pointer-events:none;
transition:opacity 0.25s ease,transform 0.25s ease;
z-index:9999;
box-shadow:0 8px 24px rgba(0,0,0,0.5);
max-width:calc(100vw - 40px);
text-align:center;
}
#toast.show{
opacity:1;
transform:translate(-50%,0);
}
</style>
</head>
<body>
<div class="header-wrap">
<h1 class="main-title" id="titleText">Random Name Picker</h1>
<select id="langSelect">
<option value="en" selected>English</option>
<option value="zh">中文</option>
<option value="ja">日本語</option>
</select>
</div>
<div class="panel">
<div class="display">
<div id="show">—</div>
</div>
<div class="status" id="status"></div>
<div class="btn-group cols-3">
<button id="start" class="btn-primary">Start</button>
<button id="reset" class="btn-secondary">Reset</button>
<button id="edit" class="btn-secondary">Edit Names</button>
<button id="setPwd" class="btn-secondary">Change Password</button>
<button id="importBtn" class="btn-secondary">Import Config</button>
<button id="exportBtn" class="btn-secondary">Export Config</button>
</div>
<div class="edit-wrap" id="editWrap">
<textarea id="editArea" placeholder="One name per line"></textarea>
<div class="btn-group">
<button id="save" class="btn-primary">Save Names</button>
<button id="cancel" class="btn-secondary">Cancel</button>
</div>
</div>
</div>
<div class="footer">© 2020-2026 fuey All Rights Reserved</div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".js" hidden>
<script src="config.js"></script>
<script>
const faviconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#161618" stroke="#3a3a40" stroke-width="1.4"/><circle cx="15" cy="12.5" r="3.6" fill="none" stroke="#e8e8ec" stroke-width="1.8"/><path d="M8 24.5c0-3.9 3.2-7 7-7s7 3.1 7 7" fill="none" stroke="#e8e8ec" stroke-width="1.8" stroke-linecap="round"/><circle cx="23.5" cy="8.5" r="2" fill="#e8e8ec"/></svg>';
const faviconBlob = new Blob([faviconSvg], {type: "image/svg+xml"});
const faviconUrl = URL.createObjectURL(faviconBlob);
const faviconLink = document.createElement("link");
faviconLink.rel = "icon";
faviconLink.type = "image/svg+xml";
faviconLink.href = faviconUrl;
document.head.appendChild(faviconLink);

const i18n = {
  zh: {
    title: "随机点名器",
    start: "开始",
    stop: "停止",
    reset: "重置",
    edit: "编辑名单",
    setPwd: "修改密码",
    importBtn: "导入配置",
    exportBtn: "导出配置",
    save: "保存名单",
    cancel: "取消编辑",
    statusLoaded: n => `已加载 ${n} 人`,
    statusRemaining: (total, picked) => `已点 ${picked} / 共 ${total} 人`,
    statusEmpty: "请先编辑名单",
    statusAllDone: "已全部点完",
    statusReset: "已重置",
    statusPwdChanged: "密码已修改，请导出配置保存",
    statusSaved: "配置已导出",
    statusCanceled: "已取消编辑",
    statusImported: "配置导入成功",
    statusImportFail: "配置文件解析失败",
    statusPwdWrong: "密码错误",
    promptEdit: "请输入管理员密码：",
    promptOldPwd: "请输入当前密码：",
    promptNewPwd: "请输入新密码：",
    promptSave: "请输入管理员密码以保存：",
    placeholder: "每行一个名字",
    blockRightClick: "此操作已被禁用",
    blockDevTools: "开发者工具已被禁用",
    blockViewSource: "查看源代码已被禁用"
  },
  en: {
    title: "Random Name Picker",
    start: "Start",
    stop: "Stop",
    reset: "Reset",
    edit: "Edit Names",
    setPwd: "Change Password",
    importBtn: "Import Config",
    exportBtn: "Export Config",
    save: "Save Names",
    cancel: "Cancel",
    statusLoaded: n => `Loaded ${n} names`,
    statusRemaining: (total, picked) => `Picked ${picked} / ${total}`,
    statusEmpty: "Please add names first",
    statusAllDone: "All names have been picked",
    statusReset: "Reset complete",
    statusPwdChanged: "Password changed, export config to save",
    statusSaved: "Config exported",
    statusCanceled: "Edit canceled",
    statusImported: "Config imported",
    statusImportFail: "Failed to parse config file",
    statusPwdWrong: "Wrong password",
    promptEdit: "Enter admin password:",
    promptOldPwd: "Enter current password:",
    promptNewPwd: "Enter new password:",
    promptSave: "Enter admin password to save:",
    placeholder: "One name per line",
    blockRightClick: "This action is disabled",
    blockDevTools: "Developer tools are disabled",
    blockViewSource: "Viewing source is disabled"
  },
  ja: {
    title: "ランダム名前ピッカー",
    start: "開始",
    stop: "停止",
    reset: "リセット",
    edit: "名簿編集",
    setPwd: "パスワード変更",
    importBtn: "設定をインポート",
    exportBtn: "設定をエクスポート",
    save: "名簿を保存",
    cancel: "キャンセル",
    statusLoaded: n => `${n} 人を読み込みました`,
    statusRemaining: (total, picked) => `${picked} / ${total} 人選択済み`,
    statusEmpty: "先に名簿を編集してください",
    statusAllDone: "全て選択済み",
    statusReset: "リセットしました",
    statusPwdChanged: "パスワード変更済み、設定をエクスポートしてください",
    statusSaved: "設定をエクスポートしました",
    statusCanceled: "編集をキャンセルしました",
    statusImported: "設定をインポートしました",
    statusImportFail: "設定ファイルの解析に失敗しました",
    statusPwdWrong: "パスワードが違います",
    promptEdit: "管理者パスワードを入力：",
    promptOldPwd: "現在のパスワードを入力：",
    promptNewPwd: "新しいパスワードを入力：",
    promptSave: "保存するには管理者パスワードを入力：",
    placeholder: "1行に1つ名前",
    blockRightClick: "この操作は無効です",
    blockDevTools: "開発者ツールは無効です",
    blockViewSource: "ソースの表示は無効です"
  }
};

let pwd = (typeof adminPwd !== "undefined" && typeof adminPwd === "string") ? adminPwd : "";
let list = (typeof nameList !== "undefined" && Array.isArray(nameList)) ? nameList.slice() : [];
let used = new Set();
let rolling = false;
let timer = null;
let isEditVerified = false;
let currentLang = (typeof language !== "undefined" && i18n[language]) ? language : "en";
let statusKey = "statusLoaded";
let statusArgs = [list.length];
let toastTimer = null;

function T(){
  return i18n[currentLang];
}

const show = document.getElementById("show");
const statusEl = document.getElementById("status");
const titleText = document.getElementById("titleText");
const langSelect = document.getElementById("langSelect");
const startBtn = document.getElementById("start");
const resetBtn = document.getElementById("reset");
const editBtn = document.getElementById("edit");
const setPwdBtn = document.getElementById("setPwd");
const importBtn = document.getElementById("importBtn");
const exportBtn = document.getElementById("exportBtn");
const saveBtn = document.getElementById("save");
const cancelBtn = document.getElementById("cancel");
const editArea = document.getElementById("editArea");
const editWrap = document.getElementById("editWrap");
const fileInput = document.getElementById("fileInput");
const toastEl = document.getElementById("toast");

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove("show");
  }, 1800);
}

function setStatus(key, ...args){
  statusKey = key;
  statusArgs = args;
  const fn = T()[key];
  statusEl.textContent = typeof fn === "function" ? fn(...args) : fn;
}

function refreshText(){
  const t = T();
  titleText.textContent = t.title;
  startBtn.textContent = rolling ? t.stop : t.start;
  resetBtn.textContent = t.reset;
  editBtn.textContent = t.edit;
  setPwdBtn.textContent = t.setPwd;
  importBtn.textContent = t.importBtn;
  exportBtn.textContent = t.exportBtn;
  saveBtn.textContent = t.save;
  cancelBtn.textContent = t.cancel;
  editArea.placeholder = t.placeholder;
  langSelect.value = currentLang;
  document.documentElement.lang = currentLang === "zh" ? "zh-CN" : currentLang;
  setStatus(statusKey, ...statusArgs);
}

function stopRolling(){
  rolling = false;
  clearInterval(timer);
  startBtn.textContent = T().start;
}

function clearDisplay(){
  show.textContent = "—";
  show.classList.remove("picked");
}

function exportConfigFile(){
  const content = `// Admin password
const adminPwd = ${JSON.stringify(pwd)};

// Name list
const nameList = ${JSON.stringify(list, null, 2)};

// UI language: zh / en / ja
const language = ${JSON.stringify(currentLang)};`;
  const blob = new Blob([content], {type: "text/javascript"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "config.js";
  a.click();
  URL.revokeObjectURL(url);
  setStatus("statusSaved");
  setTimeout(() => {
    if(statusKey === "statusSaved") setStatus("statusLoaded", list.length);
  }, 1400);
}

function importConfigFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const code = e.target.result;
      const fn = new Function(code + "\nvar __lang = typeof language !== 'undefined' ? language : 'en';\nreturn { adminPwd, nameList, language: __lang };");
      const res = fn();
      if(typeof res.adminPwd !== "string" || !Array.isArray(res.nameList)) throw new Error("invalid");
      pwd = res.adminPwd;
      list = res.nameList.map(s => String(s)).filter(s => s.trim() !== "");
      currentLang = i18n[res.language] ? res.language : "en";
      used.clear();
      stopRolling();
      clearDisplay();
      editWrap.classList.remove("active");
      editArea.value = "";
      isEditVerified = false;
      refreshText();
      setStatus("statusImported");
      setTimeout(() => {
        if(statusKey === "statusImported") setStatus("statusLoaded", list.length);
      }, 1400);
    } catch(err) {
      alert(T().statusImportFail);
    }
  };
  reader.readAsText(file);
}

startBtn.onclick = () => {
  if(list.length === 0){
    setStatus("statusEmpty");
    return;
  }
  if(!rolling){
    rolling = true;
    startBtn.textContent = T().stop;
    show.classList.remove("picked");
    timer = setInterval(() => {
      const remaining = list.filter(x => !used.has(x));
      if(remaining.length === 0){
        stopRolling();
        clearDisplay();
        setStatus("statusAllDone");
        return;
      }
      show.textContent = remaining[Math.floor(Math.random() * remaining.length)];
    }, 80);
  } else {
    stopRolling();
    const picked = show.textContent;
    show.classList.add("picked");
    if(picked && picked !== "—"){
      used.add(picked);
    }
    if(used.size >= list.length){
      setStatus("statusAllDone");
    } else {
      setStatus("statusRemaining", list.length, used.size);
    }
  }
};

resetBtn.onclick = () => {
  used.clear();
  stopRolling();
  clearDisplay();
  setStatus("statusReset");
  setTimeout(() => {
    if(statusKey === "statusReset") setStatus("statusLoaded", list.length);
  }, 1200);
};

editBtn.onclick = () => {
  if(editWrap.classList.contains("active")) return;
  const input = prompt(T().promptEdit);
  if(input === null) return;
  if(input !== pwd){
    alert(T().statusPwdWrong);
    return;
  }
  isEditVerified = true;
  editArea.value = list.join("\n");
  editWrap.classList.add("active");
};

setPwdBtn.onclick = () => {
  const old = prompt(T().promptOldPwd);
  if(old === null) return;
  if(old !== pwd){
    alert(T().statusPwdWrong);
    return;
  }
  const np = prompt(T().promptNewPwd);
  if(np === null || np.trim() === "") return;
  pwd = np;
  isEditVerified = true;
  setStatus("statusPwdChanged");
};

importBtn.onclick = () => {
  fileInput.click();
};

fileInput.onchange = e => {
  const f = e.target.files[0];
  if(f) importConfigFile(f);
  fileInput.value = "";
};

exportBtn.onclick = () => {
  exportConfigFile();
};

saveBtn.onclick = () => {
  if(!isEditVerified){
    const input = prompt(T().promptSave);
    if(input === null) return;
    if(input !== pwd){
      alert(T().statusPwdWrong);
      return;
    }
    isEditVerified = true;
  }
  list = editArea.value.split("\n").map(s => s.trim()).filter(Boolean);
  used.clear();
  stopRolling();
  clearDisplay();
  editWrap.classList.remove("active");
  editArea.value = "";
  isEditVerified = false;
  exportConfigFile();
};

cancelBtn.onclick = () => {
  editWrap.classList.remove("active");
  editArea.value = "";
  isEditVerified = false;
  setStatus("statusCanceled");
  setTimeout(() => {
    if(statusKey === "statusCanceled") setStatus("statusLoaded", list.length);
  }, 1200);
};

langSelect.onchange = e => {
  const val = e.target.value;
  currentLang = i18n[val] ? val : "en";
  refreshText();
};

document.addEventListener("contextmenu", e => {
  e.preventDefault();
  showToast(T().blockRightClick);
});
document.addEventListener("keydown", e => {
  const k = e.key.toUpperCase();
  if(e.key === "F12"){
    e.preventDefault();
    showToast(T().blockDevTools);
    return false;
  }
  if(e.ctrlKey && e.shiftKey && (k === "I" || k === "J" || k === "C")){
    e.preventDefault();
    showToast(T().blockDevTools);
    return false;
  }
  if(e.ctrlKey && k === "U"){
    e.preventDefault();
    showToast(T().blockViewSource);
    return false;
  }
});

refreshText();
</script>
</body>
</html>
