<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        html, body {
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        .embed-content {
            padding: 24px 0;
            color: var(--text);
            transition: color 0.4s ease;
        }
        .embed-content h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text);
        }
        .embed-content p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="embed-content">
        <h2 data-lang-key="embedTitle">Here is your custom content</h2>
        <p data-lang-key="embedDesc">Edit embed.html to change what appears here.</p>
    </div>

    <script src="js/lang.js"></script>
    <script src="js/rule.js"></script>
    <script>
        window.__applyFueyLang = function (lang) {
            if (typeof langData === "undefined") return;
            if (!langData[lang]) lang = "en";
            window.currentLang = lang;
            document.querySelectorAll("[data-lang-key]").forEach(el => {
                const key = el.getAttribute("data-lang-key");
                if (langData[lang][key]) {
                    el.textContent = langData[lang][key];
                }
            });
        };
        if (typeof applyLang === "function") applyLang();

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "fuey-embed-ready" }, "*");
        }
    </script>
</body>
</html>
