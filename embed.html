<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        html, body {
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
            height: auto;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        .embed-content {
            padding: 24px 0;
            color: var(--text);
            transition: color 0.4s ease;
        }
        .embed-content h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text);
        }
        .embed-content p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .changelog-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }
        .changelog-item {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-sm);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        [data-theme="dark"] .changelog-item {
            background: rgba(255, 255, 255, 0.06);
        }
        .changelog-item:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.15);
        }
        .changelog-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .changelog-version {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 2px 10px;
            border-radius: var(--radius-pill);
        }
        .changelog-date {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .changelog-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .changelog-section {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }
        .changelog-desc {
            list-style: none;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .changelog-desc li {
            position: relative;
            padding-left: 16px;
            margin-top: 4px;
        }
        .changelog-desc li::before {
            content: "·";
            position: absolute;
            left: 4px;
            color: var(--accent);
            font-weight: 700;
        }
        .embed-sub {
            margin-top: 24px;
        }
        .embed-sub-frame {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="embed-content" id="embedContent">
        <h2 id="embedTitle"></h2>
        <p id="embedDesc"></p>
        <ul id="changelogList" class="changelog-list"></ul>

        <div class="embed-sub">
            <iframe id="notesFrame" class="embed-sub-frame" scrolling="no" frameborder="0" src="embed-notes.html"></iframe>
        </div>
    </div>

    <script src="data/embed-update-logs.js"></script>
    <script src="js/rule.js"></script>
    <script>
        const notesFrame = document.getElementById("notesFrame");
        const titleEl = document.getElementById("embedTitle");
        const descEl = document.getElementById("embedDesc");
        const listEl = document.getElementById("changelogList");
        const logData = window.__EMBED_UPDATE_LOGS__;
        let currentEmbedLang = "en";

        function formatEmbedDate(isoDate) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate || "");
            if (!m) return isoDate || "";
            const [, y, mo, d] = m;
            return currentEmbedLang === "zh" ? `${y}/${mo}/${d}` : `${d}/${mo}/${y}`;
        }

        function renderLogs() {
            const pack = logData[currentEmbedLang] || logData.en;
            titleEl.textContent = pack.embedTitle;
            descEl.textContent = pack.embedDesc;
            listEl.innerHTML = pack.logs.map(log => {
                const sections = log.sections.map(sec => {
                    const sectionTitle = pack[sec.key] || sec.key;
                    const items = sec.items.map(text => `<li>${text}</li>`).join("");
                    return `<div class="changelog-section">${sectionTitle}</div><ul class="changelog-desc">${items}</ul>`;
                }).join("");
                return `
                    <li class="changelog-item">
                        <div class="changelog-header">
                            <span class="changelog-version">${log.version}</span>
                            <span class="changelog-date">${formatEmbedDate(log.date)}</span>
                        </div>
                        <div class="changelog-title">${log.title}</div>
                        ${sections}
                    </li>
                `;
            }).join("");
        }

        function applyEmbedLang(lang) {
            if (!logData[lang]) lang = "en";
            currentEmbedLang = lang;
            renderLogs();
            syncNotes();
        }

        function reportHeight() {
            if (!window.parent || window.parent === window) return;
            const h = Math.max(
                document.body.scrollHeight,
                document.body.offsetHeight,
                document.documentElement.scrollHeight,
                document.documentElement.offsetHeight
            );
            window.parent.postMessage({ type: "fuey-embed-resize", height: h }, "*");
        }

        function syncNotes() {
            if (!notesFrame || !notesFrame.contentWindow) return;
            try {
                notesFrame.contentWindow.postMessage({
                    type: "fuey-embed-sync",
                    theme: document.documentElement.getAttribute("data-theme") || "light",
                    lang: currentEmbedLang
                }, "*");
            } catch (e) {}
        }

        window.addEventListener("message", (e) => {
            if (!e.data) return;
            if (e.data.type === "fuey-embed-sync") {
                if (e.data.theme) {
                    document.documentElement.setAttribute("data-theme", e.data.theme);
                    document.documentElement.style.colorScheme = e.data.theme;
                }
                if (e.data.lang) applyEmbedLang(e.data.lang);
            } else if (e.data.type === "fuey-embed-ready" && e.source === notesFrame.contentWindow) {
                syncNotes();
            } else if (e.data.type === "fuey-embed-resize" && e.source === notesFrame.contentWindow) {
                if (typeof e.data.height === "number" && e.data.height > 0) {
                    notesFrame.style.height = e.data.height + "px";
                }
            }
        });

        window.__applyFueyLang = function (lang) {
            applyEmbedLang(lang);
        };

        applyEmbedLang(localStorage.getItem("fuey-lang") || "en");

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "fuey-embed-ready" }, "*");
        }

        if (window.ResizeObserver) {
            new ResizeObserver(reportHeight).observe(document.body);
        } else {
            setInterval(reportHeight, 500);
        }
    </script>
</body>
</html>
